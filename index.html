<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WE AURA</title>
    <script>
      window.addEventListener('error', function(e) {
        var msg = (e.message || '').toLowerCase();
        var errStr = e.error ? (e.error.message || String(e.error)).toLowerCase() : '';
        var isPeerError = msg.indexOf('peerjs') !== -1 || msg.indexOf('peer') !== -1 || msg.indexOf('connect') !== -1 ||
                            errStr.indexOf('peerjs') !== -1 || errStr.indexOf('peer') !== -1 || errStr.indexOf('connect') !== -1;
        if (isPeerError) {
          try {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
          } catch(err) {}
          return;
        }
        showFallbackError(e.message || errStr || 'Erro desconhecido', e.filename + ':' + e.lineno);
      });
      window.addEventListener('unhandledrejection', function(e) {
        var reasonStr = e.reason ? (e.reason.message || String(e.reason)) : '';
        var lowerReason = reasonStr.toLowerCase();
        var isPeerError = lowerReason.indexOf('peerjs') !== -1 || lowerReason.indexOf('peer') !== -1 || lowerReason.indexOf('connect') !== -1;
        if (isPeerError) {
          try {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
          } catch(err) {}
          return;
        }
        showFallbackError(reasonStr || 'Erro desconhecido');
      });

      function showFallbackError(msg, loc) {
        var rootEl = document.getElementById('root');
        if (rootEl && (!rootEl.firstElementChild || rootEl.innerHTML.indexOf('animate-spin') !== -1)) {
          if (document.getElementById('fallback-error-overlay')) return;
          var overlay = document.createElement('div');
          overlay.id = 'fallback-error-overlay';
          overlay.style.position = 'fixed';
          overlay.style.inset = '0';
          overlay.style.backgroundColor = '#020202';
          overlay.style.color = '#ffffff';
          overlay.style.zIndex = '999999';
          overlay.style.display = 'flex';
          overlay.style.flexDirection = 'column';
          overlay.style.alignItems = 'center';
          overlay.style.justifyContent = 'center';
          overlay.style.padding = '24px';
          overlay.style.fontFamily = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
          overlay.style.textAlign = 'center';

          overlay.innerHTML = 
            '<div style="max-width: 380px; width: 100%; background: #0c0c0c; border: 1px solid rgba(168, 85, 247, 0.4); border-radius: 32px; padding: 32px; box-shadow: 0 40px 100px rgba(0,0,0,0.95); box-sizing: border-box;">' +
              '<div style="display: inline-flex; width: 60px; height: 60px; background: rgba(168, 85, 247, 0.1); border-radius: 20px; align-items: center; justify-content: center; margin-bottom: 24px; border: 1px solid rgba(168, 85, 247, 0.3);">' +
                '<svg style="width: 28px; height: 28px; color: #a855f7;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>' +
              '</div>' +
              '<h1 style="font-size: 18px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.15em; color: #ffffff; margin-bottom: 12px; font-style: italic;">WE AURA</h1>' +
              '<p style="font-size: 12px; color: rgba(255,255,255,0.4); line-height: 1.6; margin-bottom: 24px;">' +
                'Detectamos uma restrição de sistema ou erro de carregamento. Isso costuma ocorrer no modo Navegação Privada do Safari ou em navegadores embutidos (Instagram/TikTok/WhatsApp).' +
              '</p>' +
              '<div style="background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(239, 68, 68, 0.15); border-radius: 18px; padding: 12px 16px; text-align: left; margin-bottom: 24px; max-height: 110px; overflow-y: auto; box-sizing: border-box;">' +
                '<span style="font-size: 9px; font-weight: bold; color: #ef4444; text-transform: uppercase; tracking-widest: 0.1em; display: block; margin-bottom: 4px;">Informações Adicionais:</span>' +
                '<div style="font-family: monospace; font-size: 10px; color: rgba(255,255,255,0.7); word-break: break-all;">' + msg + (loc ? ' @ ' + loc : '') + '</div>' +
              '</div>' +
              '<div style="display: flex; flex-direction: column; gap: 10px;">' +
                '<button onclick="window.location.reload(true)" style="width: 100%; height: 50px; background: #ffffff; color: #020202; border: none; border-radius: 18px; font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; transition: all 0.2s;">Recarregar App</button>' +
                '<button onclick="try { localStorage.clear(); sessionStorage.clear(); window.location.reload(true); } catch(e) { window.location.reload(true); }" style="width: 100%; height: 50px; background: rgba(255,255,255,0.03); color: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; transition: all 0.2s;">Limpar Cookies e Cache</button>' +
              '</div>' +
            '</div>';

          document.body.appendChild(overlay);
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
